package:
  name: straylight-e2e
  dependencies:
    - aff
    - aff-promise
    - arrays
    - console
    - effect
    - either
    - foreign
    - foreign-object
    - foldable-traversable
    - literals
    - maybe
    - node-buffer
    - node-process
    - nullable
    - playwright
    - prelude
    - strings
    - untagged-union
  build:
    strict: true
    censor_project_warnings:
      - WildcardInferredType
  bundle:
    module: E2E.Main
    outfile: dist/e2e.js
    platform: node
    extra_args:
      - "--external:playwright"

workspace:
  package_set:
    registry: 73.2.0
  extra_packages:
    playwright:
      git: https://github.com/klntsky/purescript-playwright.git
      ref: master
      dependencies:
        - aff
        - aff-promise
        - argonaut-core
        - console
        - datetime
        - effect
        - either
        - exceptions
        - foreign
        - foreign-object
        - literals
        - maybe
        - node-buffer
        - node-fs
        - node-streams
        - ordered-collections
        - prelude
        - refs
        - strings
        - transformers
        - untagged-union
